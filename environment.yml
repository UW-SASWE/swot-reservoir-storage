# The environment this work was run in. conda is used rather than pip alone because
# cartopy and its geospatial dependencies are painful to build from source.
#
#   conda env create -f environment.yml
#   conda activate swot-reservoir-storage
name: swot-reservoir-storage
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - pyyaml>=6.0
  - pyarrow>=12.0
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - pytorch>=2.0
  - matplotlib>=3.7
  - cartopy>=0.22
  - geopandas>=0.14
  - jupyterlab
  - pip
  - pip:
      - earthaccess>=0.9   # SWOT granule access, needs ~/.netrc for urs.earthdata.nasa.gov
